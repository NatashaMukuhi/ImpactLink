<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in | ImpactLink</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="nav"></div>
<main><div class="card auth">
  <h2>Welcome back</h2><p>Log in to see your matches and applications.</p>
  <div class="f"><label for="e">Email</label><input id="e" type="email" placeholder="you@example.com" autocomplete="email"><div class="err" id="ee">Enter a valid email address.</div></div>
  <div class="f"><label for="p">Password</label><input id="p" type="password" placeholder="At least 6 characters" autocomplete="current-password"><div class="err" id="pe">Password must be at least 6 characters.</div></div>
  <button class="link" onclick="IL.toast('Password reset link sent')">Forgot password?</button>
  <div class="err" id="ae">Incorrect email or password.</div>
  <button class="btn w" onclick="go()">Log in</button>
  <div class="center">New to ImpactLink? <a href="signup.html">Create an account</a></div>
</div></main>
<script src="js/app.js"></script><script>
IL.nav('login');
const EM=/^[^@\s]+@[^@\s]+\.[^@\s]+$/,$=id=>document.getElementById(id);
async function go(){const a=EM.test($('e').value.trim()),b=$('p').value.length>=6;
$('ee').classList.toggle('on',!a);$('pe').classList.toggle('on',!b);if(!a||!b)return;
const email=$('e').value.trim(),pw=$('p').value;let u=null,msg='Incorrect email or password.';
try{const r=await IL.api('login',{email,password:pw});if(r.ok){u=r.user;IL.adopt(u);}else msg=r.error||msg;}
catch(e){u=IL.login(email,pw);if(u)IL.toast('Server not reachable: using offline demo mode');}
$('ae').textContent=msg;$('ae').classList.toggle('on',!u);
if(u)location.href=u.role==='Organization'?'org-dashboard.html':'volunteer-dashboard.html';}
</script>
